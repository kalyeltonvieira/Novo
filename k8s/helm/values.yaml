replicaCount: 3

image:
  repository: transparencia-ia/backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: transparencia.gov.br
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: transparencia-tls
      hosts:
        - transparencia.gov.br

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
