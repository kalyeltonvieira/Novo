apiVersion: apps/v1
kind: Deployment
metadata:
  name: transparencia-backend
  labels:
    app: transparencia-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: transparencia-backend
  template:
    metadata:
      labels:
        app: transparencia-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://transparencia:pwd@postgres:5432/transparencia_db"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
