name: Transparência CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & Code Quality Checks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          pytest --cov=core --cov-report=xml

      - name: Check Code Quality (Flake8)
        run: |
          flake8 core api utils tests --max-line-length=120 --ignore=E501,W503 || echo "Lint warnings found"
