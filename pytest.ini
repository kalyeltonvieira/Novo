[pytest]
# Configuração do pytest para o projeto IA Analisadora

# Diretórios de teste
testpaths = tests

# Padrões de arquivo de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de saída
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Marcadores customizados
markers =
    slow: Marca testes que demoram mais para executar
    integration: Marca testes de integração
    unit: Marca testes unitários
    requires_network: Marca testes que requerem conexão com a internet
    requires_tesseract: Marca testes que requerem Tesseract OCR instalado
    requires_spacy: Marca testes que requerem modelo spaCy instalado

# Cobertura de código (opcional, descomente para usar)
# addopts = --cov=core --cov=gui --cov=utils --cov-report=html --cov-report=term

# Timeout para testes (opcional, requer pytest-timeout)
# timeout = 60

# Log de testes (opcional)
# log_cli = true
# log_cli_level = INFO
